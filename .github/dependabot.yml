# =============================================================================
# Dependabot 自动依赖更新配置
# =============================================================================
version: 2
updates:
  # ── NuGet 依赖更新 ───────────────────────────────────────────────────────
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "nuget"
    groups:
      # xUnit 系列包合并更新
      xunit:
        patterns:
          - "xunit*"
        update-types:
          - "minor"
          - "patch"
      # 覆盖率工具、Mock 框架合并更新
      test-sdk:
        patterns:
          - "coverlet.collector"
          - "Moq"
        update-types:
          - "minor"
          - "patch"
      # 其余包合并为一组
      nuget-catchall:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── npm 依赖更新 ─────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "npm"
    groups:
      # Vue 生态相关包合并更新
      vue-ecosystem:
        patterns:
          - "vue"
          - "@vue/*"
          - "vue-tsc"
        update-types:
          - "minor"
          - "patch"
      # Vite 构建工具相关包合并更新
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      # ESLint 相关包合并更新
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
        update-types:
          - "minor"
          - "patch"
      # 测试相关包合并更新
      testing:
        patterns:
          - "vitest"
          - "@vue/test-utils"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      # 其余包合并为一组
      npm-catchall:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions 工作流依赖更新 ─────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-actions:
        patterns:
          - "*"
